# Managed symlink map: repo-relative-path -> target
# Paths under ~ expand to $HOME. Quoted targets may contain spaces.
# Lines starting with # are ignored.

zsh/zshrc -> ~/.zshrc
zsh/zshenv -> ~/.zshenv
bash/bashrc -> ~/.bashrc

git/config -> ~/.config/git/config
git/ignore -> ~/.config/git/ignore

cursor/settings.json -> ~/Library/Application Support/Cursor/User/settings.json
cursor/keybindings.json -> ~/Library/Application Support/Cursor/User/keybindings.json
cursor/snippets -> ~/Library/Application Support/Cursor/User/snippets
cursor/mcp.json -> ~/.cursor/mcp.json
cursor/skills -> ~/.cursor/skills

t3/settings.json -> ~/.t3/userdata/settings.json
t3/keybindings.json -> ~/.t3/userdata/keybindings.json
t3/client-settings.json -> ~/.t3/userdata/client-settings.json

codex/config.toml -> ~/.codex/config.toml

vite-plus/config.json -> ~/.config/vite-plus/config.json

ghostty/config.ghostty -> ~/.config/ghostty/config.ghostty

amethyst/amethyst.yml -> ~/.config/amethyst/amethyst.yml

# Uncomment when you start using pi:
# pi/settings.json -> ~/.pi/agent/settings.json
