# Homebrew / App Store packages and Cursor extensions, grouped by feature.
# Scripts in .chezmoiscripts render the enabled groups.

packages:
  darwin:
    core:
      brews:
        - ast-grep
        - chezmoi
        - fd
        - gh
        - git-filter-repo
        - git-lfs
        - jq
        - just
        - mas
        - mole
        - ncdu
        - neovim
        - pandoc
        - postgresql@16
        - ripgrep
        - shellcheck
        - uv
        - vite-plus
      casks:
        - 1password
        - 1password-cli
        - amethyst
        - cursor
        - ghostty
        - google-chrome
        - lunar
        - zed
      mas: []
    mobile:
      brews:
        - watchman
        - cocoapods
      casks:
        - zulu@17
        - android-studio
        - android-cli
      mas:
        - name: Xcode
          id: 497799835
    ai:
      brews:
        - beads
        - herdr
      casks:
        - chatgpt
        - claude
        - claude-code
        - codex
        - repo-prompt
        - t3-code
      mas: []
    localAi:
      brews:
        - llm
      casks:
        - lm-studio
        - ollama-app
        - openwhispr
      mas: []
    everyday:
      brews: []
      casks:
        - affine
        - cleanshot
        - discord
        - figma
        - linear
        - loom
        - notion
        - notion-calendar
        - obsidian
        - screen-studio
        - spotify
        - whatsapp
        - wispr-flow
        - zen
        - zoom
      mas:
        - name: 1Blocker
          id: 1365531024
        - name: DaisyDisk
          id: 411643860
        - name: Slack
          id: 803453959
        - name: Spark Desktop
          id: 6445813049
        - name: Telegram
          id: 747648890
        - name: TickTick
          id: 966085870
        - name: Whisper Transcription
          id: 1668083311

